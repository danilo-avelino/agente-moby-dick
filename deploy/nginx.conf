# /etc/nginx/sites-available/agente-metas
# Proxy reverso: nginx (80/443) → uvicorn (8000)
#
# Após certbot: este arquivo será modificado automaticamente
# para adicionar a seção HTTPS.

server {
    listen 80;
    server_name SEU_DOMINIO.duckdns.org;   # <-- ajuste

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
